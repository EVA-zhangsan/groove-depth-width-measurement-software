name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - release/finals-v1.0

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run software validation
        shell: pwsh
        run: python validate_stage5.py

      - name: Build no-console Windows package
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm product.spec

      - name: Add guide and example dataset
        shell: pwsh
        run: |
          $dst = 'dist/槽型深度宽度测量软件'
          Copy-Item SOFTWARE_GUIDE.md "$dst/使用说明.txt" -Force
          New-Item -ItemType Directory -Force -Path "$dst/data/示例图像序列" | Out-Null
          Copy-Item samples/raw_laser_demo/frame_*.* "$dst/data/示例图像序列/" -Force
          New-Item -ItemType Directory -Force -Path "$dst/outputs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dst/logs" | Out-Null

      - name: Check package layout
        shell: pwsh
        run: |
          $exe = 'dist/槽型深度宽度测量软件/槽型深度宽度测量软件.exe'
          if (-not (Test-Path $exe)) { throw "Application exe not found: $exe" }
          $count = (Get-ChildItem 'dist/槽型深度宽度测量软件/data/示例图像序列' -File -Filter 'frame_*.*').Count
          if ($count -lt 1) { throw "Example image sequence is empty" }

      - name: Archive Windows package
        shell: pwsh
        run: Compress-Archive -Path 'dist/槽型深度宽度测量软件' -DestinationPath '槽型深度宽度测量软件_v1.0_Windows.zip' -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: groove-depth-width-measurement-software-v1.0-windows
          path: 槽型深度宽度测量软件_v1.0_Windows.zip
          retention-days: 30
