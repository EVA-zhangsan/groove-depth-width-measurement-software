name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - release/finals-v1.0

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify product-facing source
        shell: pwsh
        run: |
          $app = Get-Content app.py -Raw
          $forbidden = @('ProductLauncher', '加载内置样例', '恢复内置样例', '系统状态：就绪', '开始现场演示')
          foreach ($word in $forbidden) {
            if ($app.Contains($word)) { throw "Forbidden launcher text found in app.py: $word" }
          }
          if (-not $app.Contains('window = MainWindow()')) { throw 'Direct MainWindow entry not found' }
          if (-not $app.Contains('window.showMaximized()')) { throw 'Maximized product window entry not found' }
          if (-not $app.Contains('槽深均值判定')) { throw 'Mean-based depth label not found' }
          if (-not $app.Contains('槽宽均值判定')) { throw 'Mean-based width label not found' }

          $report = Get-Content report_generator.py -Raw
          if ($report.Contains('内置演示数据')) { throw 'Legacy demo wording found in report generator' }
          if (-not $report.Contains('均值判定')) { throw 'Mean-decision wording not found in report generator' }
          if (-not $report.Contains('TTFont')) { throw 'Embeddable font registration not found in report generator' }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run software validation
        shell: pwsh
        run: python validate_stage5.py

      - name: Validate complex test sequence
        shell: pwsh
        run: python validate_complex_sequence.py

      - name: Build no-console Windows package
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm product.spec

      - name: Add guide and test datasets
        shell: pwsh
        run: |
          $dst = 'dist/槽型深度宽度测量软件'
          Copy-Item SOFTWARE_GUIDE.md "$dst/使用说明.txt" -Force
          New-Item -ItemType Directory -Force -Path "$dst/data/测试数据_A_复杂工况" | Out-Null
          python synthetic_scan_generator.py --output "$dst/data/测试数据_A_复杂工况" --frames 61
          New-Item -ItemType Directory -Force -Path "$dst/data/测试数据_B_基础工况" | Out-Null
          Copy-Item samples/raw_laser_demo/frame_*.* "$dst/data/测试数据_B_基础工况/" -Force
          $lines = @(
            '数据说明',
            '',
            '测试数据_A_复杂工况：61 帧结构光软件测试图像。包含背景噪声、光强波动、条纹轻微抖动、槽位置漂移和公差范围内的尺寸微扰，用于验证图像处理、三维重建与槽型分析的稳定性。',
            '测试数据_B_基础工况：基础软件测试图像，用于快速流程复核与备用。',
            '',
            '两组数据均属于软件测试数据，不作为真实硬件计量精度认证依据。实际测量时可通过“导入图像序列”选择设备采集的连续原始图像，帧数由实际扫描数据决定。'
          )
          Set-Content -Path "$dst/data/数据说明.txt" -Value $lines -Encoding UTF8
          New-Item -ItemType Directory -Force -Path "$dst/outputs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dst/logs" | Out-Null

      - name: Check package layout
        shell: pwsh
        run: |
          $exe = 'dist/槽型深度宽度测量软件/槽型深度宽度测量软件.exe'
          if (-not (Test-Path $exe)) { throw "Application exe not found: $exe" }
          $complexCount = (Get-ChildItem 'dist/槽型深度宽度测量软件/data/测试数据_A_复杂工况' -File -Filter 'frame_*.*').Count
          if ($complexCount -ne 61) { throw "Expected 61 complex test frames, got $complexCount" }
          $basicCount = (Get-ChildItem 'dist/槽型深度宽度测量软件/data/测试数据_B_基础工况' -File -Filter 'frame_*.*').Count
          if ($basicCount -lt 1) { throw "Basic test sequence is empty" }
          if (Test-Path 'dist/槽型深度宽度测量软件/assets') { throw 'Legacy assets directory should not exist' }
          if (Test-Path 'dist/槽型深度宽度测量软件/samples') { throw 'Legacy samples directory should not exist' }

      - name: Archive Windows package
        shell: pwsh
        run: Compress-Archive -Path 'dist/槽型深度宽度测量软件' -DestinationPath '槽型深度宽度测量软件_v1.0.3_Windows.zip' -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: groove-depth-width-measurement-software-v1.0.3-windows
          path: 槽型深度宽度测量软件_v1.0.3_Windows.zip
          retention-days: 30
