name: Build Finals Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - release/finals-v1.0

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run Stage5 validation
        shell: pwsh
        run: python validate_stage5.py

      - name: Prepare shipped demo backup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path finals_assets/demo_backup | Out-Null
          Copy-Item samples/raw_laser_demo/frame_*.* finals_assets/demo_backup/ -Force

      - name: Build no-console onedir package
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm finals.spec

      - name: Add delivery documents and fixed dataset
        shell: pwsh
        run: |
          $dst = 'dist/槽型深度宽度测量软件'
          Copy-Item README_FINALS.md "$dst/请先看我.txt" -Force
          Copy-Item docs "$dst/docs" -Recurse -Force
          Copy-Item samples "$dst/samples" -Recurse -Force
          Copy-Item finals_assets "$dst/finals_assets" -Recurse -Force

      - name: Smoke-check package layout
        shell: pwsh
        run: |
          $exe = 'dist/槽型深度宽度测量软件/槽型深度宽度测量软件.exe'
          if (-not (Test-Path $exe)) { throw "Finals exe not found: $exe" }
          $count = (Get-ChildItem 'dist/槽型深度宽度测量软件/samples/raw_laser_demo' -File -Filter 'frame_*.*').Count
          if ($count -ne 31) { throw "Expected 31 demo frames, got $count" }
          $backupCount = (Get-ChildItem 'dist/槽型深度宽度测量软件/finals_assets/demo_backup' -File -Filter 'frame_*.*').Count
          if ($backupCount -ne 31) { throw "Expected 31 backup frames, got $backupCount" }

      - name: Archive delivery folder
        shell: pwsh
        run: Compress-Archive -Path 'dist/槽型深度宽度测量软件' -DestinationPath '槽型深度宽度测量软件_Finals_v1.0_Windows.zip' -Force

      - name: Upload finals package
        uses: actions/upload-artifact@v4
        with:
          name: groove-depth-width-finals-v1.0-windows
          path: 槽型深度宽度测量软件_Finals_v1.0_Windows.zip
          retention-days: 30
