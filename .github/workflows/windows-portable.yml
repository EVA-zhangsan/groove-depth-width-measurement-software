name: Windows portable build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate external curved image datasets
        shell: pwsh
        run: |
          python -c "from demo_data import generate_demo_frames; generate_demo_frames('package_data/images_181_tight_curved', frame_count=181, seed=20260816); generate_demo_frames('package_data/images_301_tight_curved', frame_count=301, seed=20260817)"
          $count181 = (Get-ChildItem package_data/images_181_tight_curved/frame_*.png).Count
          $count301 = (Get-ChildItem package_data/images_301_tight_curved/frame_*.png).Count
          if ($count181 -ne 181) { throw "Expected 181 frames, got $count181" }
          if ($count301 -ne 301) { throw "Expected 301 frames, got $count301" }

      - name: Generate matching external point clouds
        shell: pwsh
        run: |
          python -c "from offline_reconstruction import reconstruct_directory; r1=reconstruct_directory('package_data/images_181_tight_curved','package_data/recon181'); r2=reconstruct_directory('package_data/images_301_tight_curved','package_data/recon301'); print('181 points',r1['point_count']); print('301 points',r2['point_count'])"

      - name: Validate both external datasets
        shell: pwsh
        run: |
          python -c "from offline_reconstruction import reconstruct_directory; from measurement_analysis import analyze_groove; r1=reconstruct_directory('package_data/images_181_tight_curved','package_data/check181'); m1=analyze_groove(r1['points']); r2=reconstruct_directory('package_data/images_301_tight_curved','package_data/check301'); m2=analyze_groove(r2['points']); print('181:',len(m1.sections),m1.depth_mean,m1.width_mean,m1.depth_min,m1.depth_max,m1.width_min,m1.width_max); print('301:',len(m2.sections),m2.depth_mean,m2.width_mean,m2.depth_min,m2.depth_max,m2.width_min,m2.width_max); assert r1['valid_frames']==181; assert r2['valid_frames']==301; assert abs(m1.depth_mean-0.6000)<=0.0200; assert abs(m1.width_mean-0.8500)<=0.0200; assert abs(m2.depth_mean-0.6000)<=0.0200; assert abs(m2.width_mean-0.8500)<=0.0200"

      - name: Build portable GUI compatibility edition
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "槽型深度宽度测量软件" `
            --collect-all pyvista `
            --collect-all pyvistaqt `
            --hidden-import vtkmodules.qt.QVTKRenderWindowInteractor `
            compat_entry.py

      - name: Assemble competition package
        shell: pwsh
        run: |
          $app = "dist/槽型深度宽度测量软件"
          New-Item -ItemType Directory -Force -Path "$app/示例数据/01_原始图像_181帧_紧凑曲面V槽" | Out-Null
          New-Item -ItemType Directory -Force -Path "$app/示例数据/02_原始图像_301帧_高密度紧凑曲面V槽" | Out-Null
          New-Item -ItemType Directory -Force -Path "$app/示例数据/03_外部点云" | Out-Null
          New-Item -ItemType Directory -Force -Path "$app/outputs" | Out-Null
          Copy-Item package_data/images_181_tight_curved/frame_*.png "$app/示例数据/01_原始图像_181帧_紧凑曲面V槽/"
          Copy-Item package_data/images_301_tight_curved/frame_*.png "$app/示例数据/02_原始图像_301帧_高密度紧凑曲面V槽/"
          Copy-Item package_data/recon181/reconstructed_point_cloud.csv "$app/示例数据/03_外部点云/181帧_紧凑曲面V槽点云.csv"
          Copy-Item package_data/recon301/reconstructed_point_cloud.csv "$app/示例数据/03_外部点云/301帧_高密度紧凑曲面V槽点云.csv"
          @"
          灵寻巧度 · 槽型深度宽度测量软件
          Windows 比赛兼容演示版 v1.0.5-compat

          本版专门用于避免部分电脑出现“分析结果正常，但三维点云区只剩坐标网格”的显示问题。

          推荐：
          1. 双击“槽型深度宽度测量软件.exe”。
          2. 直接点击左侧“一键运行内置案例”。
          3. 软件自动载入 181 帧比赛案例，无需手动选择路径。
          4. 三维视图采用普通点 + 截面线双重显示，兼容性更高。
          5. 原来的“选择原始图片目录”和“导入点云文件”仍然保留。

          如果兼容版仍只显示网格，请优先更新电脑显卡驱动后重试。
          "@ | Set-Content -Encoding UTF8 "$app/比赛电脑_先看我.txt"

      - name: Verify assembled files
        shell: pwsh
        run: |
          $app = "dist/槽型深度宽度测量软件"
          if (-not (Test-Path "$app/槽型深度宽度测量软件.exe")) { throw "EXE missing" }
          $count181 = (Get-ChildItem "$app/示例数据/01_原始图像_181帧_紧凑曲面V槽/frame_*.png").Count
          $count301 = (Get-ChildItem "$app/示例数据/02_原始图像_301帧_高密度紧凑曲面V槽/frame_*.png").Count
          if ($count181 -ne 181) { throw "Packaged 181 dataset count is $count181" }
          if ($count301 -ne 301) { throw "Packaged 301 dataset count is $count301" }
          if (-not (Test-Path "$app/示例数据/03_外部点云/181帧_紧凑曲面V槽点云.csv")) { throw "181 CSV missing" }
          if (-not (Test-Path "$app/示例数据/03_外部点云/301帧_高密度紧凑曲面V槽点云.csv")) { throw "301 CSV missing" }

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: groove-depth-width-v1.0.5-compat-Windows-one-click
          path: dist/槽型深度宽度测量软件/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
